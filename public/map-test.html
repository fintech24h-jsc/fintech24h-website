<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://fintech24h.com/map-test.html">
  <title>Map Coordinates Tester | Fintech24h</title>
  <style>
    body { background: #000; color: #fff; text-align: center; font-family: sans-serif; }
    #map-container { position: relative; width: 1000px; margin: 0 auto; border: 1px solid red; }
    img { width: 100%; height: auto; display: block; }
    #info { margin-bottom: 20px; font-size: 20px; }
  </style>
</head>
<body>
  <h1>Map Coordinates Tester</h1>
  <div id="info">Click anywhere on the map to get Top/Left percentages.</div>
  <div id="log"></div>
  <div id="map-container">
    <img src="/images/world-map.svg" id="map-img">
  </div>
  <script>
    const container = document.getElementById('map-container');
    const info = document.getElementById('info');
    const log = document.getElementById('log');

    container.addEventListener('click', (e) => {
      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const percentLeft = ((x / rect.width) * 100).toFixed(2);
      const percentTop = ((y / rect.height) * 100).toFixed(2);
      
      const msg = `Clicked at: left: ${percentLeft}%; top: ${percentTop}%`;
      info.textContent = msg;
      
      const p = document.createElement('p');
      p.textContent = msg;
      log.appendChild(p);

      // Create a visual marker
      const marker = document.createElement('div');
      marker.style.position = 'absolute';
      marker.style.left = percentLeft + '%';
      marker.style.top = percentTop + '%';
      marker.style.width = '10px';
      marker.style.height = '10px';
      marker.style.background = 'red';
      marker.style.borderRadius = '50%';
      marker.style.transform = 'translate(-50%, -50%)';
      container.appendChild(marker);
    });
  </script>
</body>
</html>
