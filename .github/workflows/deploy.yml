name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Astro static site
        run: npm run build
        env:
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_GRAPHQL_URL: ${{ secrets.WP_GRAPHQL_URL }}
          PUBLIC_HUBSPOT_PORTAL_ID: ${{ secrets.PUBLIC_HUBSPOT_PORTAL_ID }}
          PUBLIC_HUBSPOT_FORM_ID: ${{ secrets.PUBLIC_HUBSPOT_FORM_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Account: fintech24hvn@gmail.com | ID: f19a1ad20a5cf825ec8530f167aacc30
          # Project created via: npx wrangler pages project create fintech24h
          command: pages deploy dist --project-name=fintech24h
